# =====================================================================================
# AeroSync backend configuration.
# Every value is overridable by an environment variable; defaults target local dev
# (Kafka on :9092, PostgreSQL on :5433, Valkey on :6379 from docker-compose.yml).
# =====================================================================================
spring.application.name=aerosync
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
spring.task.scheduling.pool.size=4

# --- PostgreSQL (R2DBC) --------------------------------------------------------------
# Neon/Aiven example: r2dbc:postgresql://<host>:<port>/<db>?sslMode=require
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5433/aerosync}
spring.r2dbc.username=${SPRING_R2DBC_USERNAME:aerosync_user}
spring.r2dbc.password=${SPRING_R2DBC_PASSWORD:aerosync_password}
spring.r2dbc.pool.enabled=true
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=5
spring.r2dbc.pool.max-idle-time=5m
spring.r2dbc.pool.max-life-time=30m
spring.r2dbc.pool.max-acquire-time=10s
spring.r2dbc.pool.max-create-connection-time=10s
spring.r2dbc.pool.validation-query=SELECT 1
# schema.sql is idempotent; runs on every boot so fresh databases self-initialise.
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}

# --- Valkey / Redis ------------------------------------------------------------------
# For TLS providers set a single SPRING_DATA_REDIS_URL=rediss://user:pass@host:port
# (bound automatically by Spring Boot and preferred over host/port when present).
# SPRING_DATA_REDIS_PASSWORD / SPRING_DATA_REDIS_USERNAME are also bound automatically.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=5s
spring.data.redis.connect-timeout=5s

# --- Kafka ---------------------------------------------------------------------------
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# PLAINTEXT locally; SSL (Aiven client certs) or SASL_SSL on cloud.
spring.kafka.properties.security.protocol=${SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${SPRING_KAFKA_PROPERTIES_SASL_MECHANISM:}
spring.kafka.properties.sasl.jaas.config=${SPRING_KAFKA_PROPERTIES_SASL_JAAS_CONFIG:}
# Base64-encoded PEM documents (e.g. `base64 -i ca.pem | tr -d '\n'`). Never commit the files.
aerosync.kafka.ssl.ca-cert-b64=${KAFKA_CA_CERT_B64:}
aerosync.kafka.ssl.client-cert-b64=${KAFKA_CLIENT_CERT_B64:}
aerosync.kafka.ssl.client-key-b64=${KAFKA_CLIENT_KEY_B64:}
aerosync.kafka.consumer-group=${SPRING_KAFKA_CONSUMER_GROUP_ID:aerosync-group}
aerosync.kafka.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}
aerosync.kafka.topic-partitions=${KAFKA_TOPIC_PARTITIONS:1}
aerosync.kafka.topic-replication-factor=${KAFKA_TOPIC_REPLICATION_FACTOR:1}

# --- OpenSky live ingestion & automatic failover -------------------------------------
aerosync.opensky.enabled=${OPENSKY_ENABLED:true}
aerosync.opensky.api-url=${OPENSKY_API_URL:https://opensky-network.org/api/states/all}
# 400/day anonymous; up to 4000/day for a free registered account.
aerosync.opensky.daily-limit=${OPENSKY_DAILY_LIMIT:400}
aerosync.opensky.poll-interval-ms=${OPENSKY_POLL_INTERVAL_MS:60000}
aerosync.opensky.initial-delay-ms=${OPENSKY_INITIAL_DELAY_MS:5000}
aerosync.opensky.consecutive-error-threshold=${OPENSKY_CONSECUTIVE_ERROR_THRESHOLD:3}
aerosync.opensky.failover-cooldown-ms=${OPENSKY_FAILOVER_COOLDOWN_MS:900000}
aerosync.opensky.timeout-ms=${OPENSKY_TIMEOUT_MS:8000}
aerosync.opensky.max-flights-per-poll=${OPENSKY_MAX_FLIGHTS_PER_POLL:150}
aerosync.opensky.username=${OPENSKY_USERNAME:}
aerosync.opensky.password=${OPENSKY_PASSWORD:}

# --- Flight simulator ----------------------------------------------------------------
aerosync.simulator.interval-ms=${SIMULATOR_INTERVAL_MS:3000}
aerosync.simulator.time-scale=${SIMULATOR_TIME_SCALE:4.0}

# --- Free-tier storage protection ----------------------------------------------------
aerosync.db.persist-interval-seconds=${DB_PERSIST_INTERVAL_SECONDS:15}
aerosync.db.retention-hours=${DB_RETENTION_HOURS:24}
aerosync.cache.stale-seconds=${ACTIVE_FLIGHT_STALE_SECONDS:300}

# --- CORS (comma separated origins or patterns, e.g. https://*.vercel.app) -----------
aerosync.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging.level.org.apache.kafka=WARN

# --- Observability (Spring Boot Actuator + Micrometer) ---------------------------------
# /actuator/health (+ /liveness, /readiness), /actuator/info, /actuator/metrics, /actuator/prometheus
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.probes.enabled=true
# Component status (r2dbc, redis, ...) is shown; connection details are not.
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.metrics.tags.application=aerosync-backend
management.info.env.enabled=true
info.app.name=AeroSync backend
info.app.description=Real-time flight telemetry pipeline (OpenSky -> Kafka -> Valkey/PostgreSQL -> WebSocket)
# JSON logs for log aggregators: set LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs (or logstash).
