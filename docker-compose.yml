services:
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aerosync-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      # Updated to broadcast internal network name
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  postgres:
    image: postgres:16-alpine
    container_name: aerosync-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: aerosync
      POSTGRES_USER: aerosync_user
      POSTGRES_PASSWORD: aerosync_password
    volumes:
      - postgres_aerosync:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8.0
    container_name: aerosync-valkey
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: aerosync-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka
      - valkey
    environment:
      - SPRING_R2DBC_URL=r2dbc:postgresql://postgres:5432/aerosync
      - SPRING_DATA_REDIS_HOST=valkey
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092

  frontend:
    build: ./frontend
    container_name: aerosync-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_aerosync: